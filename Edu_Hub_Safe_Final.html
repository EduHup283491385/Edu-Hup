<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edu Hub</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer}.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 7%;background:#fff;border-bottom:1px solid #e7eaf0;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:800;color:#315efb}.nav-actions{display:flex;gap:10px}.container{max-width:1100px;margin:auto;padding:45px 20px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:35px;align-items:center;min-height:75vh}.hero h1{font-size:48px;margin:10px 0}.hero h1 span{color:#315efb}.hero p{font-size:19px;line-height:1.9;color:#596579}.card{background:#fff;border:1px solid #e7eaf0;border-radius:20px;padding:24px;box-shadow:0 10px 30px #1b2a4a0d}.feature-grid,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.feature h3{margin-bottom:8px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#315efb;color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#315efb}.btn.danger{background:#ffecec;color:#d33}.btn.small{padding:8px 12px;font-size:14px}.form{max-width:520px;margin:35px auto}.form h2{text-align:center}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-weight:700}.field input,.field select{width:100%;padding:13px;border:1px solid #d8deea;border-radius:11px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:#687386}.center{text-align:center}.error{color:#c62828;background:#fff0f0;padding:10px;border-radius:10px}.success{color:#18794e;background:#edfff6;padding:10px;border-radius:10px}.dashboard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.stats .card strong{font-size:28px;display:block;margin-top:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid #edf0f5;text-align:right}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#fff3d8;color:#9a6500;font-size:13px}.empty{padding:40px;text-align:center}.ai{border:2px solid #dce4ff;background:#f8faff}.ai h3{color:#315efb}.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{max-width:600px;width:100%;background:#fff;border-radius:20px;padding:25px;max-height:90vh;overflow:auto}.hidden{display:none}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h1{font-size:37px}.feature-grid,.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.nav{padding:15px 4%}.nav-actions{flex-wrap:wrap}.table{font-size:13px}}
/* Safe premium visual layer */
:root{--p:#4f46e5;--p2:#7c3aed;--ink:#182033;--muted:#687386;--bg:#f7f8ff}
body{background:radial-gradient(circle at 8% 8%,#e9e8ff 0,transparent 28%),radial-gradient(circle at 92% 18%,#e2f8ff 0,transparent 25%),var(--bg);color:var(--ink)}
.nav{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(38,50,90,.08)}
.logo{display:flex;align-items:center;gap:8px;color:var(--p);font-weight:800}.logo:before{content:'✦';display:grid;place-items:center;width:30px;height:30px;border-radius:10px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 7px 16px rgba(79,70,229,.25)}
.btn{background:linear-gradient(135deg,var(--p),#6d5dfc);box-shadow:0 8px 18px rgba(79,70,229,.2);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(79,70,229,.28);filter:brightness(1.03)}.btn:active{transform:scale(.98)}
.btn.secondary{background:#fff;color:var(--p);border:1px solid #dfe2ff;box-shadow:none}
.card{border-color:#e5e8f2;box-shadow:0 14px 38px rgba(43,53,104,.07);transition:transform .2s ease,box-shadow .2s ease}.card:hover{box-shadow:0 18px 42px rgba(43,53,104,.11)}
.hero h1{line-height:1.2;letter-spacing:-1px}.hero h1 span{background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;color:transparent}
.field input,.field select{transition:border-color .18s,box-shadow .18s,transform .18s}.field input:focus,.field select:focus{outline:none;border-color:#7c73ff;box-shadow:0 0 0 4px rgba(99,102,241,.12);transform:translateY(-1px)}
.feature-grid .card{transition:transform .2s ease}.feature-grid .card:hover{transform:translateY(-4px)}
.modal-bg{animation:fade .18s ease}.modal{animation:pop .22s ease}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>const app=document.getElementById('app');
const SCHOOL_PASSWORD='EDUHUB2026';
let users=JSON.parse(localStorage.getItem('eduHubUsers')||'[]');
let grades=JSON.parse(localStorage.getItem('eduHubGrades')||'[]');
let current=JSON.parse(localStorage.getItem('eduHubCurrent')||'null');

function save(){localStorage.setItem('eduHubUsers',JSON.stringify(users));localStorage.setItem('eduHubGrades',JSON.stringify(grades));localStorage.setItem('eduHubCurrent',JSON.stringify(current))}
function nav(){return `<div class="nav"><div class="logo">Edu Hub 🎓</div><div class="nav-actions">${current?`<button class="btn secondary" onclick="dashboard()">لوحة التحكم</button><button class="btn" onclick="logout()">خروج</button>`:`<button class="btn secondary" onclick="login()">دخول</button><button class="btn" onclick="chooseSignup()">إنشاء حساب</button>`}</div></div>`}
function home(){app.innerHTML=nav()+`<main class="container"><section class="hero"><div><div class="badge">Smart Education Platform</div><h1>حوّل درجات الطلاب إلى <span>خطة تحسن حقيقية</span></h1><p>Edu Hub منصة تعليمية لمتابعة أداء الطلاب، اكتشاف نقاط الضعف، ومساعدة المدرسة والمدرس والطالب على اتخاذ خطوات واضحة للتحسين.</p><div class="nav-actions"><button class="btn" onclick="chooseSignup()">ابدأ الآن</button><button class="btn secondary" onclick="login()">لدي حساب بالفعل</button></div></div><div class="card"><h2>كيف يعمل Edu Hub؟</h2><div class="feature-grid"><div class="feature"><h3>📊 رصد</h3><p class="muted">تسجيل ومتابعة الدرجات.</p></div><div class="feature"><h3>🔎 تحليل</h3><p class="muted">اكتشاف المواد التي تحتاج دعمًا.</p></div><div class="feature"><h3>🤖 تحسين</h3><p class="muted">خطة تحسين مخصصة بالـAI.</p></div></div></div></section><section class="feature-grid"><div class="card"><h3>👨‍🎓 للطالب</h3><p class="muted">تابع درجاتك ومستوى تقدمك وخطة التحسين.</p></div><div class="card"><h3>👩‍🏫 للمدرس</h3><p class="muted">أضف الطلاب والدرجات وتابع نقاط الضعف.</p></div><div class="card"><h3>🏫 للمدرسة</h3><p class="muted">نظام موحد يساعد على متابعة الأداء التعليمي.</p></div></section></main>`}
function login(){app.innerHTML=nav()+`<main class="container"><div class="card form"><h2>تسجيل الدخول</h2><div id="msg"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><button class="btn" onclick="doLogin()">دخول</button><p class="center muted">ليس لديك حساب؟ <a href="#" onclick="chooseSignup()">إنشاء حساب</a></p></div></main>`}
function doLogin(){const e=document.getElementById('email'),p=document.getElementById('pass'),m=document.getElementById('msg');let u=users.find(x=>x.email===e.value.trim()&&x.pass===p.value);if(!u){m.innerHTML='<div class="error">بيانات الدخول غير صحيحة.</div>';return}current=u;save();dashboard()}
function chooseSignup(){app.innerHTML=nav()+`<main class="container"><div class="card form"><h2>إنشاء حساب جديد</h2><p class="center muted">اختاري نوع الحساب الذي تريدين إنشاءه</p><div class="feature-grid" style="grid-template-columns:1fr 1fr"><div class="card center"><div style="font-size:42px">👨‍🎓</div><h3>طالب</h3><p class="muted">متابعة الدرجات وخطة التحسين.</p><button class="btn" onclick="signup()">إنشاء حساب طالب</button></div><div class="card center"><div style="font-size:42px">👩‍🏫</div><h3>مدرس</h3><p class="muted">إدارة الطلاب وإضافة الدرجات.</p><button class="btn" onclick="teacherSignup()">إنشاء حساب مدرس</button></div></div></div></main>`}
function signup(){app.innerHTML=nav()+`<main class="container"><div class="card form"><h2>إنشاء حساب طالب</h2><div id="msg"></div><div class="field"><label>الاسم الكامل</label><input id="name"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><div class="row"><div class="field"><label>المرحلة التعليمية</label><select id="stage" onchange="stageChanged()"><option>ابتدائي</option><option>إعدادي</option><option>ثانوي</option><option>بكالوريا</option></select></div><div class="field"><label>الصف</label><select id="gradeLevel"></select></div></div><div id="trackBox" class="field hidden"><label>مسار البكالوريا</label><select id="track"><option>علوم</option><option>رياضيات</option><option>آداب</option><option>مسار آخر</option></select></div><div class="field"><label>اسم المدرسة (اختياري)</label><input id="school"></div><button class="btn" onclick="doSignup()">إنشاء الحساب</button></div></main>`;stageChanged()}
function stageChanged(){let s=document.getElementById('stage').value, g=document.getElementById('gradeLevel');let arr=s==='ابتدائي'?['الأول','الثاني','الثالث','الرابع','الخامس','السادس']:s==='إعدادي'?['الأول','الثاني','الثالث']:s==='ثانوي'?['الأول','الثاني','الثالث']:['الأولى بكالوريا','الثانية بكالوريا','الثالثة بكالوريا'];g.innerHTML=arr.map(x=>`<option>${x}</option>`).join('');document.getElementById('trackBox').classList.toggle('hidden',s!=='بكالوريا')}
function doSignup(){const n=document.getElementById('name'),e=document.getElementById('email'),p=document.getElementById('pass'),s=document.getElementById('stage'),g=document.getElementById('gradeLevel'),t=document.getElementById('track'),sc=document.getElementById('school'),m=document.getElementById('msg');if(!n.value.trim()||!e.value.trim()||!p.value){m.innerHTML='<div class="error">من فضلك املئي البيانات الأساسية.</div>';return}if(users.some(x=>x.email===e.value.trim())){m.innerHTML='<div class="error">هذا البريد مسجل بالفعل.</div>';return}let u={id:Date.now(),role:'student',name:n.value.trim(),email:e.value.trim(),pass:p.value,stage:s.value,gradeLevel:g.value,track:s.value==='بكالوريا'?t.value:'',school:sc.value.trim(),linked:false};users.push(u);current=u;save();dashboard()}
function teacherSignup(){app.innerHTML=nav()+`<main class="container"><div class="card form"><h2>إنشاء حساب مدرس</h2><div id="msg"></div><div class="field"><label>اسم المدرس</label><input id="name"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><div class="field"><label>المادة</label><input id="subject" placeholder="مثال: الرياضيات"></div><div class="field"><label>كلمة سر المدرسة</label><input id="schoolPass" type="password"></div><button class="btn" onclick="doTeacher()">إنشاء حساب</button></div></main>`}
function doTeacher(){const n=document.getElementById('name'),e=document.getElementById('email'),p=document.getElementById('pass'),sp=document.getElementById('schoolPass'),sub=document.getElementById('subject'),m=document.getElementById('msg');if(sp.value!==SCHOOL_PASSWORD){m.innerHTML='<div class="error">كلمة سر المدرسة غير صحيحة.</div>';return}if(users.some(x=>x.email===e.value.trim())){m.innerHTML='<div class="error">هذا البريد مسجل بالفعل.</div>';return}let u={id:Date.now(),role:'teacher',name:n.value.trim(),email:e.value.trim(),pass:p.value,subject:sub.value.trim()};users.push(u);current=u;save();dashboard()}
function dashboard(){if(!current)return home();if(current.role==='teacher')return teacherDash();studentDash()}
function studentDash(){let gs=grades.filter(g=>g.studentId===current.id);app.innerHTML=nav()+`<main class="container"><div class="dashboard-head"><div><h1>مرحبًا، ${current.name} 👋</h1><p class="muted">${current.stage} — ${current.gradeLevel}${current.track?' — مسار '+current.track:''}</p></div></div><div class="stats"><div class="card"><span class="muted">عدد المواد</span><strong>${gs.length}</strong></div><div class="card"><span class="muted">متوسط الدرجات</span><strong>${gs.length?Math.round(gs.reduce((a,b)=>a+b.score,0)/gs.length)+'%':'—'}</strong></div><div class="card"><span class="muted">حالة الربط</span><strong>${current.linked?'مرتبط':'غير مرتبط'}</strong></div></div><div class="card" style="margin-top:20px">${!current.linked?`<div class="empty"><h2>لم يتم ربط حسابك ببيانات المدرسة بعد</h2><p class="muted">بمجرد ربط حسابك من المدرسة، ستظهر درجاتك وتحليلات مستواك هنا.</p></div>`:`<><h2>درجاتي</h2>${gs.length?`<table class="table"><tr><th>المادة</th><th>الدرجة</th><th>الحالة</th><th></th></tr>${gs.map(g=>`<tr><td>${g.subject}</td><td>${g.score}/100</td><td>${g.score<60?'<span class="badge">تحتاج تحسين</span>':'<span class="success">جيد</span>'}</td><td>${g.score<60?`<button class="btn small" onclick="aiPlan('${g.subject}',${g.score})">تحسين بالـAI</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد درجات مسجلة بعد.</div>'}</>`}</div><div class="card" style="margin-top:20px"><h3>🤖 المساعدة الذكية</h3><p class="muted">سيتم اقتراح خطة تحسين تلقائية عند وجود مادة تحتاج دعمًا.</p></div></main>`}
function teacherDash(){app.innerHTML=nav()+`<main class="container"><div class="dashboard-head"><div><h1>لوحة المدرس 👩‍🏫</h1><p class="muted">مرحبًا ${current.name} — ${current.subject||'مدرس'}</p></div><button class="btn" onclick="addGrade()">+ إضافة درجة</button></div><div class="card"><h2>الطلاب</h2>${users.filter(u=>u.role==='student').length?`<table class="table"><tr><th>الطالب</th><th>المرحلة</th><th>المادة</th><th>الدرجة</th><th></th></tr>${users.filter(u=>u.role==='student').map(s=>{let gs=grades.filter(g=>g.studentId===s.id);return gs.length?gs.map(g=>`<tr><td>${s.name}</td><td>${s.stage} - ${s.gradeLevel}</td><td>${g.subject}</td><td>${g.score}/100</td><td>${g.score<60?'<span class="badge">يحتاج تحسين</span>':'—'}</td></tr>`).join(''):`<tr><td>${s.name}</td><td>${s.stage}</td><td>—</td><td>لا توجد درجات</td><td><button class="btn small" onclick="addGrade(${s.id})">إضافة</button></td></tr>`}).join('')}</table>`:'<div class="empty">لا يوجد طلاب مسجلون بعد.</div>'}</div></main>`}
function addGrade(studentId){let students=users.filter(u=>u.role==='student');let opts=students.map(s=>`<option value="${s.id}" ${s.id==studentId?'selected':''}>${s.name}</option>`).join('');app.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><h2>إضافة درجة</h2><div class="field"><label>الطالب</label><select id="mStudent">${opts}</select></div><div class="field"><label>المادة</label><input id="mSubject" value="${current.subject||''}"></div><div class="field"><label>الدرجة من 100</label><input id="mScore" type="number" min="0" max="100"></div><button class="btn" onclick="saveGrade()">حفظ</button> <button class="btn secondary" onclick="closeModal()">إلغاء</button></div></div>`)}
function saveGrade(){let sid=Number(mStudent.value), score=Number(mScore.value);if(!mSubject.value||isNaN(score)||score<0||score>100)return alert('أدخلي بيانات صحيحة');grades.push({id:Date.now(),studentId:sid,subject:mSubject.value.trim(),score});let st=users.find(u=>u.id===sid);if(st)st.linked=true;save();closeModal();teacherDash()}
function closeModal(){document.getElementById('modal')?.remove()}
function aiPlan(subject,score){let plan=`<div class="modal-bg" id="modal"><div class="modal ai"><h2>🤖 خطة تحسين ${subject}</h2><p>بناءً على الدرجة الحالية <strong>${score}/100</strong>، هذه خطة تجريبية مخصصة:</p><ol><li>مراجعة أساسيات المادة وتحديد الأجزاء الأقل إتقانًا.</li><li>30 دقيقة تدريب يوميًا على المهارات الأساسية.</li><li>حل 5–10 أسئلة متدرجة الصعوبة بعد كل جلسة.</li><li>مراجعة الأخطاء وتسجيلها في ملف متابعة.</li><li>إعادة تقييم المستوى أسبوعيًا لمتابعة التحسن.</li></ol><p class="muted">ملاحظة: في النسخة النهائية يمكن ربط هذه الصفحة بنموذج AI حقيقي لإنشاء خطة أدق اعتمادًا على بيانات الطالب.</p><button class="btn" onclick="closeModal()">تم</button></div></div>`;app.insertAdjacentHTML('beforeend',plan)}
function logout(){current=null;save();home()}
home();</script>
</body>
</html>
